<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#247849"><link rel="manifest" href="manifest.webmanifest"><title>Meine Rezepte</title><style>
body{margin:0;background:#f6f8f6;color:#17251c;font:16px/1.45 system-ui,sans-serif}header{background:white;padding:18px;position:sticky;top:0;border-bottom:1px solid #dfe8e1}main{max-width:760px;margin:auto;padding:16px 14px 90px}h1{font-size:25px;margin:0}h2{font-size:20px}.sub,small{color:#68756d}.btn{border:0;border-radius:12px;background:#247849;color:white;padding:11px 14px;font-weight:650}.light{background:#e9f5ed;color:#247849}.card{background:white;border:1px solid #dfe8e1;border-radius:15px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.recipe{background:white;border:1px solid #dfe8e1;border-radius:15px;padding:12px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd8cf;border-radius:10px;font:inherit;margin:5px 0 10px}textarea{min-height:90px}label{font-weight:650}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:10px}nav button{border:0;background:white;padding:6px;color:#247849}.ingredient{padding:9px 0;border-bottom:1px solid #eee}.step{padding:10px 0;border-bottom:1px solid #eee}.num{display:inline-grid;place-items:center;background:#247849;color:white;border-radius:50%;width:27px;height:27px;margin-right:8px}.hidden{display:none}.muted{font-size:13px;color:#68756d}
</style></head><body><header><div class="row"><div><h1>🥣 Meine Rezepte</h1><div class="sub">Dein digitales Kochbuch</div></div><button class="btn" onclick="page='import';render()">＋ Rezept</button></div></header><main id="app"></main><nav><button onclick="page='home';render()">⌂ Start</button><button onclick="page='recipes';render()">▦ Rezepte</button><button onclick="page='import';render()">⇧ Import</button><button onclick="page='settings';render()">⚙ Daten</button></nav><input id="media" class="hidden" type="file" accept="image/*,video/*"><script>
let page='home',recipes=JSON.parse(localStorage.getItem('myrecipes')||'[]'),editing=null,servings=4,mediaData=null;
const save=()=>{localStorage.setItem('myrecipes',JSON.stringify(recipes));render()},esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parse(t){let lines=t.split(/\n/).map(x=>x.trim()).filter(Boolean),title=lines[0]||'Neues Rezept',ing=[],steps=[],sec='';for(let l of lines.slice(1)){if(/zutaten/i.test(l)){sec='i';continue}if(/zubereitung|anleitung/i.test(l)){sec='s';continue}if(sec==='i')ing.push(l.replace(/^[-•*]\s*/,''));else if(sec==='s')steps.push(l.replace(/^\d+[.)]\s*/,''))}return{title,ingredients:ing.join('\n'),steps:steps.join('\n')}}
function add(seed={}){editing={id:Date.now().toString(),title:seed.title||'',category:'Sonstiges',minutes:30,ingredients:seed.ingredients||'',steps:seed.steps||'',source:seed.source||'',url:seed.url||'',favorite:false,media:mediaData};mediaData=null;editor()}
function editor(){let r=editing;document.getElementById('app').innerHTML=`<button class="btn light" onclick="page='import';render()">← Zurück</button><h2>Rezept bearbeiten</h2><div class="card"><label>Rezeptname</label><input id="title" value="${esc(r.title)}"><label>Kategorie</label><input id="cat" value="${esc(r.category)}"><label>Zeit (Minuten)</label><input id="mins" type="number" value="${r.minutes}"><label>Zutaten – eine pro Zeile</label><textarea id="ings" placeholder="200 g Mehl">${esc(r.ingredients)}</textarea><label>Zubereitung – ein Schritt pro Zeile</label><textarea id="steps">${esc(r.steps)}</textarea><label>Quelle / Link</label><input id="source" value="${esc(r.source)}"><div class="row"><button class="btn" onclick="saveEdit()">Speichern</button><button class="btn light" onclick="editing=null;page='recipes';render()">Abbrechen</button></div></div>`}
function saveEdit(){editing.title=document.getElementById('title').value.trim()||'Rezept';editing.category=document.getElementById('cat').value;editing.minutes=+document.getElementById('mins').value||0;editing.ingredients=document.getElementById('ings').value;editing.steps=document.getElementById('steps').value;editing.source=document.getElementById('source').value;let i=recipes.findIndex(x=>x.id===editing.id);if(i<0)recipes.unshift(editing);else recipes[i]=editing;editing=null;page='recipes';save()}
function importPage(){document.getElementById('app').innerHTML=`<h2>Rezept importieren</h2><div class="card"><h3>Facebook / Instagram / Chefkoch</h3><label>Video- oder Rezeptlink</label><input id="url" placeholder="https://…"><p class="muted">Plattformen erlauben nicht immer den automatischen Abruf der Beschreibung. Füge sie unten ein, wenn der Zugriff blockiert ist.</p><label>Videobeschreibung oder Rezepttext</label><textarea id="desc" placeholder="Kopiere die Videobeschreibung hier hinein …"></textarea><button class="btn" onclick="descImport()">Beschreibung in Rezept umwandeln</button></div><div class="card"><h3>WhatsApp / kopierter Text</h3><textarea id="text" placeholder="Rezeptname\nZutaten\n200 g Mehl\nZubereitung\nAlles verrühren …"></textarea><button class="btn" onclick="textImport()">Text übernehmen</button></div><div class="card"><h3>Screenshot oder Video</h3><p class="muted">Datei bis 8 MB anhängen.</p><button class="btn light" onclick="document.getElementById('media').click()">Bild / Video auswählen</button><p id="picked" class="muted">${mediaData?'Medium ausgewählt':'Noch kein Medium ausgewählt'}</p><button class="btn" onclick="add({source:'Import aus Medien'})">Rezept anlegen</button></div><div class="card"><button class="btn light" onclick="add({})">Manuell eingeben</button></div>`}
function descImport(){let url=document.getElementById('url').value.trim(),d=document.getElementById('desc').value.trim();if(!d&&!url){alert('Link oder Beschreibung einfügen.');return}let p=parse(d);add({title:d?p.title:'Rezept von Social Media',ingredients:p.ingredients,steps:p.steps,source:url||'Facebook / Instagram',url})}
function textImport(){let t=document.getElementById('text').value.trim();if(!t){alert('Bitte Text einfügen.');return}let p=parse(t);add({title:p.title,ingredients:p.ingredients,steps:p.steps,source:'Importierter Text'})}
function detail(r){servings=r.servings||4;let ing=(r.ingredients||'').split('\n').filter(Boolean),steps=(r.steps||'').split('\n').filter(Boolean);document.getElementById('app').innerHTML=`<button class="btn light" onclick="page='recipes';render()">← Zurück</button><div class="card"><h2>${esc(r.title)}</h2><p class="muted">${esc(r.category)} · ${r.minutes} Min. · ${esc(r.source)}</p>${r.url?`<a href="${esc(r.url)}" target="_blank">Originalvideo / Rezept öffnen ↗</a>`:''}</div><div class="card"><div class="row"><h2>Zutaten</h2><div><button class="btn light" onclick="servings=Math.max(1,servings-1);detail({...recipes.find(x=>x.id==='${r.id}'),servings})">−</button> ${servings} Portionen <button class="btn light" onclick="servings=Math.min(50,servings+1);detail({...recipes.find(x=>x.id==='${r.id}'),servings})">＋</button></div></div>${ing.map(x=>{let m=x.match(/^(\d+(?:[.,]\d+)?)\s*(g|kg|ml|l|EL|TL|Stück)?\s+(.+)$/i);return `<div class="ingredient"><label><input type="checkbox" style="width:auto"> ${esc(m?m[3]:x)}</label><b>${m?(Number(m[1].replace(',','.'))*servings/4).toLocaleString('de-DE')+' '+(m[2]||''):''}</b></div>`}).join('')}</div><div class="card"><h2>Zubereitung</h2>${steps.map((x,i)=>`<div class="step"><span class="num">${i+1}</span>${esc(x)}</div>`).join('')||'<p class="muted">Noch keine Schritte hinterlegt.</p>'}</div><button class="btn" onclick="editing={...recipes.find(x=>x.id==='${r.id}')};editor()">Bearbeiten</button> <button class="btn light" onclick="recipes=recipes.filter(x=>x.id!=='${r.id}');save()">Löschen</button>`}
function render(){let a=document.getElementById('app');if(editing){editor();return}if(page==='import'){importPage();return}if(page==='settings'){a.innerHTML=`<h2>Daten & Installation</h2><div class="card"><p>Diese Version speichert Rezepte lokal im Browser. Cloud-Synchronisierung ist noch nicht eingerichtet.</p><button class="btn" onclick="let b=new Blob([JSON.stringify(recipes,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='meine-rezepte.json';a.click()">Rezepte sichern (JSON)</button><p class="muted">Zum Installieren auf Android müssen die Dateien auf einer HTTPS-Webseite liegen; in Chrome dann „App installieren“ wählen.</p></div>`;return}let q=page==='home'?`<input placeholder="Rezepte suchen" id="q" oninput="filterRecipes(this.value)">`:'';a.innerHTML=`${q}<div class="row"><h2>${page==='home'?'Deine Sammlung':'Alle Rezepte'}</h2><span class="muted">${recipes.length} Rezepte</span></div><div class="grid" id="list">${recipes.map(r=>`<div class="recipe"><div style="font-size:30px">🍲</div><b>${esc(r.title)}</b><p class="muted">${esc(r.category)} · ${r.minutes} Min.</p><button class="btn light" onclick="detail(recipes.find(x=>x.id==='${r.id}'))">Öffnen</button></div>`).join('')}</div>${recipes.length?'':`<div class="card"><h3>Noch keine Rezepte</h3><p>Füge dein erstes Rezept hinzu.</p><button class="btn" onclick="page='import';render()">Rezept hinzufügen</button></div>`}`}
function filterRecipes(q){document.querySelectorAll('#list .recipe').forEach(el=>el.style.display=el.innerText.toLowerCase().includes(q.toLowerCase())?'':'none')}
document.getElementById('media').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;if(f.size>8*1024*1024){alert('Datei muss kleiner als 8 MB sein.');return}let rd=new FileReader();rd.onload=()=>{mediaData=rd.result;let p=document.getElementById('picked');if(p)p.textContent='Ausgewählt: '+f.name};rd.readAsDataURL(f)});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></main></body></html>
